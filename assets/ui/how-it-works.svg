<svg xmlns="http://www.w3.org/2000/svg" width="900" height="252" viewBox="0 0 900 252">
    <defs><linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020816"/><stop offset=".52" stop-color="#090d24"/><stop offset="1" stop-color="#030716"/></linearGradient></defs>
    <rect x="1" y="1" width="898" height="250" rx="14" fill="url(#pbg)" stroke="#313b68"/>
    <text x="55" y="46" fill="#f5f6ff" font-family="Courier New,monospace" font-size="13" font-weight="700" letter-spacing="3">HOW THIS PROFILE GAME WORKS</text>
    <path d="M50 58H850" stroke="#313b68"/><text x="62" y="74" fill="#d9c7ff" font-family="Courier New,monospace" font-size="13" font-weight="700">GitHub Issues are the authoritative move log.</text><text x="62" y="98" fill="#c9ccda" font-family="Courier New,monospace" font-size="13">Each Action rebuilds the deterministic board by replaying [PLAY] issues in order.</text><text x="62" y="122" fill="#c9ccda" font-family="Courier New,monospace" font-size="13">game/state.json and game/replay.json are generated projections, not sources of truth.</text><text x="62" y="146" fill="#c9ccda" font-family="Courier New,monospace" font-size="13">Board cells reference immutable reusable gem SVG assets instead of regenerating them.</text><text x="62" y="170" fill="#c9ccda" font-family="Courier New,monospace" font-size="13">Only README.md, HUD, leaderboard, state and replay normally change after a move.</text><text x="62" y="194" fill="#c9ccda" font-family="Courier New,monospace" font-size="13">GitHub Actions serialize moves, reject stale requests, commit the projection, and close the issue.</text>
  </svg>